name: Unique Counts

on:
  workflow_dispatch:
    inputs:
      r2_prefix:
        description: "R2 prefix"
        required: true
        default: "merged-restaurant-info/year=2025/month=09/day=17/"

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3

      - name: Run analysis
        env:
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: ${{ github.event.inputs.r2_prefix }}
        run: python market_insights.py 2>&1 | tee analysis_log.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unique-counts
          path: |
            market_insights.json
            unique_restaurants.json
            restaurants_grouped.json
            unique_branches.json
            branches_grouped.json
            restaurant_branch_counts.json
            restaurants_multiple_branches.json
            cuisine_distribution.json
            duplicates_details.json
            restaurants_multiple_names.json
            restaurants_merged_by_id.json
            restaurant_city_distribution.json
            analysis_log.txt
          if-no-files-found: warn