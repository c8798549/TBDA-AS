name: Add Branch URL

on:
  workflow_dispatch:

jobs:
  add-branch-url:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 pandas openpyxl

      - name: Add branchSlug and branch_url
        env:
          R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: "merged-restaurant-info/year=2025/month=09/day=17/"
          # The workbook you edited (must be in the repo) and the sheet to add the columns to
          INPUT_PATH: "branch_area_mapped.xlsx"
          INPUT_SHEET: "mapped"
          OUT_DIR: "add_branch_url_output"
        run: python add_branch_url.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: add-branch-url-output
          path: add_branch_url_output/
          if-no-files-found: warn