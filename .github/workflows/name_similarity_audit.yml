name: Name Similarity Audit

on:
  workflow_dispatch:
    inputs:
      r2_prefix:
        description: "R2 prefix containing the restaurant JSON files"
        required: true
        default: "merged-restaurant-info/year=2025/month=09/day=17/"
      fuzzy_min_ratio:
        description: "Minimum spelling similarity threshold (lower = more candidates)"
        required: true
        default: "0.86"
      token_jaccard_min:
        description: "Minimum token overlap threshold (lower = more candidates)"
        required: true
        default: "0.60"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Run name similarity audit
        env:
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: ${{ inputs.r2_prefix }}
          FUZZY_MIN_RATIO: ${{ inputs.fuzzy_min_ratio }}
          TOKEN_JACCARD_MIN: ${{ inputs.token_jaccard_min }}
        run: python name_similarity_audit.py

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: talabat-name-similarity-audit
          if-no-files-found: error
          retention-days: 14
          path: |
            data_quality_summary.json
            unique_restaurants_by_id.json
            name_similarity_candidates.json
            name_similarity_candidates.csv
