name: Analyze Restaurant Data

on:
  workflow_dispatch:

jobs:
  analyze-r2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install boto3 pandas

      - name: Analyze restaurant files
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python analyze_r2_restaurants.py

      - name: Upload analysis JSON
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-analysis-2025-09-17
          path: restaurant_analysis_2025-09-17.json
          retention-days: 30