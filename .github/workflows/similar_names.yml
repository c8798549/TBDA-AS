name: Similar Restaurant Names

on:
  workflow_dispatch:   # manual run only

jobs:
  find-similar-names:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3

      - name: Run similarity candidates extraction
        env:
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: "merged-restaurant-info/year=2025/month=09/day=17/"
          OUT_FILE: "similar_name_candidates.csv"
        run: python similar_names.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: similar-name-candidates
          path: similar_name_candidates.csv
          retention-days: 30