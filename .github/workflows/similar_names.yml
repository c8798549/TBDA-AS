name: Similar Restaurant Names

on:
  workflow_dispatch:   # manual run only
    inputs:
      fuzzy_min_score:
        description: "Fuzzy spelling threshold (0-100)"
        default: "88"
      union_max_group:
        description: "Max group size allowed to merge review clusters"
        default: "40"
      include_weak_only:
        description: "Include ids that only have weak reasons (1/0)"
        default: "0"

jobs:
  find-similar-names:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install boto3 rapidfuzz numpy

      - name: Run similarity candidates extraction
        env:
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: "merged-restaurant-info/year=2025/month=09/day=17/"
          OUT_FILE: "similar_name_candidates.csv"
          LOGO_AUDIT_FILE: "logo_audit.csv"
          FUZZY_MIN_SCORE: ${{ inputs.fuzzy_min_score }}
          UNION_MAX_GROUP: ${{ inputs.union_max_group }}
          INCLUDE_WEAK_ONLY: ${{ inputs.include_weak_only }}
        run: python similar_names.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: similar-name-candidates
          path: |
            similar_name_candidates.csv
            logo_audit.csv
          retention-days: 30