name: Market Structure Analysis

on:
  workflow_dispatch:

jobs:
  market-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 pandas openpyxl

      - name: Run market structure analysis
        env:
          R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: "merged-restaurant-info/year=2025/month=09/day=17/"
          # ملف الـ brand grouping (فيه sheet restaurants): ارفعيه في الـ repo (MAPPING_PATH)
          # أو سيبي MAPPING_PATH واكتبي MAPPING_R2_KEY لو هو على R2
          MAPPING_PATH: "unique_restaurants_grouped_by_brand.xlsx"
          MAPPING_R2_KEY: ""
          MAPPING_SHEET: "restaurants"
          MAPPING_ID_COL: "id"
          MAPPING_NAME_COL: "name"
          MAPPING_BRANCH_COL: "branchId"
          # ملف map للمناطق: أعمدة area_id , area_name
          AREA_MAP_PATH: "shoparea_and_id.xlsx"
          AREA_MAP_ID_COL: "area_id"
          AREA_MAP_LABEL_COL: "area_name"
          EXPECTED_RESTAURANTS: "0"
          TOP_N: "10"
          OUT_DIR: "market_structure_output"
        run: python market_structure.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-structure-output
          path: market_structure_output/
          if-no-files-found: warn