name: Market Structure Analysis

on:
  workflow_dispatch:

jobs:
  market-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 pandas openpyxl

      - name: Run market structure analysis
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: "merged-restaurant-info/year=2025/month=09/day=17/"
          MAPPING_PATH: "data/restaurants_validated.xlsx"
          MAPPING_R2_KEY: ""
          MAPPING_SHEET: "unique"
          MAPPING_ID_COL: "id"
          MAPPING_NAME_COL: "name"
          MAPPING_BRANCH_COL: "branchId"
          EXPECTED_RESTAURANTS: "3979"
          TOP_N: "10"
          OUT_DIR: "market_structure_output"
        run: python market_structure.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-structure-output
          path: market_structure_output/
          if-no-files-found: warn