name: Geography Insights

on:
  workflow_dispatch:
    inputs:
      r2_prefix:
        description: "R2 prefix"
        required: true
        default: "merged-restaurant-info/year=2025/month=09/day=17/"

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3

      - name: Run analysis
        env:
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: ${{ github.event.inputs.r2_prefix }}
        run: python geography_insights.py 2>&1 | tee analysis_log.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography_insights
          path: |
            geography_insights.json
            area_cuisine_concentration.json
            area_cuisine_gaps.json
            area_branch_restaurant_ratio.json
          if-no-files-found: warn