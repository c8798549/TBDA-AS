name: Investigate R2 Structure

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3

      - name: Investigate structure
        env:
          R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: "restaurant-info/year=2025/month=09/"
          # Folders whose file names are printed at the end (one per line, empty = skip)
          LIST_FILES_PREFIXES: |
            restaurant-info/year=2025/month=09/day=04/validation/
          OUT_DIR: "structure_output"
        run: python investigate_structure.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-report
          path: structure_output/
          if-no-files-found: warn