name: Name Similarity Export

on:
  workflow_dispatch:
    inputs:
      r2_prefix:
        description: "R2 prefix to process"
        required: true
        default: "merged-restaurant-info/year=2025/month=09/day=17/"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3

      - name: Run name similarity export
        env:
          R2_PREFIX: ${{ inputs.r2_prefix }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python name_similarity_export.py

      - name: Upload review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: name-similarity-review
          path: |
            name_similarity_review.csv
            name_similarity_review.json
          if-no-files-found: warn
          retention-days: 14
